name: Compiler l'application Harrwama Admin

# Démarre automatiquement dès que le dépôt reçoit les fichiers (push),
# et peut aussi être relancé à la main (onglet Actions > Run workflow).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HarrwamaAdmin.apk

      - name: Enregistrer l'APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HarrwamaAdmin-apk
          path: HarrwamaAdmin.apk

      - name: Publier l'APK dans Releases (téléchargement direct depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest HarrwamaAdmin.apk \
            --target "$GITHUB_SHA" \
            --title "Harrwama Admin (dernière version)" \
            --notes "APK compilé automatiquement. Téléchargez HarrwamaAdmin.apk puis installez-le."
